name: CI

# Baseline checks on pull requests, so the gentinel bot PR clean-up can merge
# dependency updates once they pass. Also runs on main: the clean-up ignores
# checks that already fail on the default branch.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: function
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: function/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive
      - name: validate terraform
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
