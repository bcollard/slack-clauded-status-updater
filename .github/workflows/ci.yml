name: CI

# Baseline checks on pull requests, so the gentinel bot PR clean-up can merge
# dependency updates once they pass. Also runs on main: the clean-up ignores
# checks that already fail on the default branch.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: function
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: function/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive
      - name: validate terraform
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
